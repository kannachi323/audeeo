name: Audeeo checks
on: [push, pull_request]
jobs:
 web-and-relay:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '24', cache: npm}
   - run: cp .env.example .env
   - run: npm ci
   - run: npm --prefix services/session-relay ci
   - run: npm run check
 native-apple:
  runs-on: macos-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '24', cache: npm}
   - run: cp .env.example .env
   - run: npm ci
   - run: npm run build
   - run: cargo check --manifest-path src-tauri/Cargo.toml
   - run: swift build --package-path native/apple --product AudeeoNative
 audeeo-core:
  strategy:
   matrix:
    os: [macos-latest, windows-latest, ubuntu-latest]
  runs-on: ${{ matrix.os }}
  steps:
   - uses: actions/checkout@v4
   - run: cargo test --manifest-path crates/audeeo-core/Cargo.toml
   - if: runner.os == 'macOS'
     run: swift build --package-path crates/audeeo-core/apple
